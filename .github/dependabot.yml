version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dev:
        dependency-type: development
      python-runtime:
        dependency-type: production

  - package-ecosystem: npm # also covers pnpm, through web/pnpm-lock.yaml
    directory: /web
    schedule:
      interval: weekly
    ignore:
      # typescript-eslint needs TypeScript below 6.1 and openapi-typescript needs 5.x.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      web-dev:
        dependency-type: development
      web-runtime:
        dependency-type: production
