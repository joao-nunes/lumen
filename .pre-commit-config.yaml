# Install once with: uv run pre-commit install
# Run on everything: uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^web/pnpm-lock\.yaml$ # multi-document by design
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.5
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # mypy runs from the project environment so it sees the real dependencies
  # (SQLAlchemy, pydantic plugin, scipy-stubs) rather than an isolated copy.
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      # Claude Code hooks sit outside the `lumen` package, so check them by file name.
      - id: mypy-claude-hooks
        name: mypy (Claude Code hooks)
        entry: uv run mypy
        language: system
        files: ^\.claude/hooks/.*\.py$

  # The web tools run from web/node_modules: `pnpm --dir web install` first.
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: pnpm --dir web exec prettier --write .
        language: system
        files: ^web/
        pass_filenames: false
      - id: eslint
        name: eslint
        entry: pnpm --dir web exec eslint . --max-warnings 0
        language: system
        files: ^web/
        pass_filenames: false
      - id: tsc
        name: tsc
        entry: pnpm --dir web exec tsc --noEmit
        language: system
        files: ^web/
        pass_filenames: false
